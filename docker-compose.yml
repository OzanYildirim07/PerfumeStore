version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: luxperfume-db
    environment:
      POSTGRES_DB: luxperfume
      POSTGRES_USER: luxuser
      POSTGRES_PASSWORD: luxpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxuser -d luxperfume"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
